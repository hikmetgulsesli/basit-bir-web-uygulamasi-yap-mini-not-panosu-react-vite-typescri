<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Not Ekle/Düzenle - Mini Not Panosu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#32343d",
                        "error": "#ffb4ab",
                        "background": "#11131b",
                        "surface-container-high": "#282a32",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-container": "#bc4800",
                        "on-background": "#e1e2ed",
                        "on-surface": "#e1e2ed",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-tertiary": "#581e00",
                        "on-surface-variant": "#c3c6d7",
                        "on-secondary-fixed-variant": "#3a485b",
                        "outline-variant": "#434655",
                        "error-container": "#93000a",
                        "surface-tint": "#b4c5ff",
                        "tertiary": "#ffb596",
                        "surface-bright": "#373942",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-dim": "#11131b",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-low": "#191b23",
                        "on-primary-fixed": "#00174b",
                        "on-primary": "#002a78",
                        "primary": "#b4c5ff",
                        "inverse-on-surface": "#2e3039",
                        "on-error": "#690005",
                        "primary-container": "#2563eb",
                        "on-secondary": "#233144",
                        "outline": "#8d90a0",
                        "on-secondary-container": "#abb9d1",
                        "secondary-container": "#3c4a5e",
                        "surface": "#11131b",
                        "on-tertiary-fixed": "#360f00",
                        "surface-variant": "#32343d",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container": "#1d1f27",
                        "secondary": "#b9c7df",
                        "inverse-surface": "#e1e2ed",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb596",
                        "primary-fixed-dim": "#b4c5ff",
                        "inverse-primary": "#0053db",
                        "on-secondary-fixed": "#0d1c2e",
                        "surface-container-lowest": "#0c0e16",
                        "secondary-fixed": "#d5e3fc",
                        "on-primary-container": "#eeefff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "unit": "8px",
                        "touch-target": "44px",
                        "2xl": "48px",
                        "sm": "8px",
                        "xl": "32px",
                        "margin": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "h1": ["Inter"],
                        "h3": ["Inter"],
                        "h2": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "h1": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen flex flex-col overflow-hidden">
<!-- TopNavBar: Suppressed because this is a transactional/task-focused screen (Ekle/Düzenle) -->
<!-- SideNavBar: Suppressed because this is a transactional/task-focused screen (Ekle/Düzenle) -->
<div class="flex-1 overflow-y-auto">
<main class="max-w-[800px] mx-auto w-full px-md md:px-lg py-xl md:py-2xl">
<header class="mb-xl flex items-center justify-between">
<div>
<h1 class="font-h1 text-h1 text-on-surface mb-sm">Yeni Not Ekle</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Düşüncelerinizi kaydedin ve düzenleyin.</p>
</div>
<button class="h-[44px] w-[44px] flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<form class="bg-surface-container-low rounded-xl border border-outline-variant p-lg md:p-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.5)]">
<div class="space-y-lg">
<!-- Başlık Alanı -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs flex justify-between" for="note-title">
                            Başlık <span class="text-error font-label-sm text-label-sm">*Zorunlu alan</span>
</label>
<input class="w-full h-[44px] bg-[#1E293B] border border-[#334155] rounded-DEFAULT px-md font-body-md text-body-md text-on-surface placeholder:text-[#94A3B8] focus:border-[#2563EB] focus:ring-0 focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:ring-offset-2 focus:ring-offset-[#11131b] transition-all" id="note-title" name="note-title" placeholder="Not başlığını buraya girin..." required="" type="text"/>
</div>
<!-- Kategori Alanı -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm">Kategori</label>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="category" type="radio" value="work"/>
<div class="h-lg px-md rounded-lg flex items-center justify-center font-label-sm text-label-sm border border-outline-variant text-on-surface-variant peer-checked:bg-primary-container/20 peer-checked:text-primary peer-checked:border-primary-container transition-colors focus-within:ring-2 focus-within:ring-primary-container focus-within:ring-offset-2 focus-within:ring-offset-background">
                                    İş
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio" value="personal"/>
<div class="h-lg px-md rounded-lg flex items-center justify-center font-label-sm text-label-sm border border-outline-variant text-on-surface-variant peer-checked:bg-secondary-container/30 peer-checked:text-secondary peer-checked:border-secondary-container transition-colors focus-within:ring-2 focus-within:ring-primary-container focus-within:ring-offset-2 focus-within:ring-offset-background">
                                    Kişisel
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio" value="ideas"/>
<div class="h-lg px-md rounded-lg flex items-center justify-center font-label-sm text-label-sm border border-outline-variant text-on-surface-variant peer-checked:bg-tertiary-container/30 peer-checked:text-tertiary peer-checked:border-tertiary-container transition-colors focus-within:ring-2 focus-within:ring-primary-container focus-within:ring-offset-2 focus-within:ring-offset-background">
                                    Fikirler
                                </div>
</label>
<button class="h-lg px-sm rounded-lg flex items-center justify-center border border-dashed border-outline-variant text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background" type="button">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
</div>
<!-- İçerik Alanı -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs flex justify-between" for="note-content">
                            İçerik <span class="text-error font-label-sm text-label-sm">*Zorunlu alan</span>
</label>
<div class="border border-[#334155] rounded-DEFAULT bg-[#1E293B] overflow-hidden focus-within:border-[#2563EB] focus-within:ring-2 focus-within:ring-[#2563EB] focus-within:ring-offset-2 focus-within:ring-offset-[#11131b] transition-all">
<!-- Formatting Toolbar (Simplified) -->
<div class="bg-surface-container-high border-b border-[#334155] flex p-xs gap-xs">
<button class="h-unit w-unit flex items-center justify-center rounded hover:bg-surface-container-highest text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined text-[18px]">format_bold</span>
</button>
<button class="h-unit w-unit flex items-center justify-center rounded hover:bg-surface-container-highest text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined text-[18px]">format_italic</span>
</button>
<button class="h-unit w-unit flex items-center justify-center rounded hover:bg-surface-container-highest text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
</button>
<div class="w-[1px] bg-[#334155] my-xs mx-xs"></div>
<button class="h-unit w-unit flex items-center justify-center rounded hover:bg-surface-container-highest text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined text-[18px]">link</span>
</button>
</div>
<textarea class="w-full bg-transparent border-none p-md font-body-md text-body-md text-on-surface placeholder:text-[#94A3B8] resize-y focus:ring-0 focus:outline-none min-h-[150px]" id="note-content" name="note-content" placeholder="Notunuzu yazmaya başlayın..." required="" rows="8"></textarea>
</div>
</div>
<!-- Ekstra Seçenekler -->
<div class="flex items-center gap-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox"/>
<div class="w-[18px] h-[18px] rounded-lg border border-[#334155] bg-[#1E293B] peer-checked:bg-[#2563EB] peer-checked:border-[#2563EB] transition-colors peer-focus-visible:ring-2 peer-focus-visible:ring-[#2563EB] peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-[#11131b]"></div>
<span class="material-symbols-outlined absolute text-[14px] text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Önemli olarak işaretle</span>
</label>
</div>
</div>
<!-- Aksiyonlar -->
<div class="mt-xl pt-lg border-t border-outline-variant flex flex-col-reverse sm:flex-row justify-end gap-md">
<button class="min-h-[44px] px-lg rounded-DEFAULT border border-[#334155] text-[#F8FAFC] font-label-md text-label-md hover:bg-surface-container-highest active:scale-98 transition-all focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:ring-offset-2 focus:ring-offset-[#11131b]" type="button">
                        İptal
                    </button>
<button class="min-h-[44px] px-lg rounded-DEFAULT bg-[#2563EB] text-[#FFFFFF] font-label-md text-label-md hover:bg-opacity-90 active:scale-98 transition-all focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:ring-offset-2 focus:ring-offset-[#11131b] flex items-center justify-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                        Kaydet
                    </button>
</div>
</form>
</main>
</div>
</body></html>
