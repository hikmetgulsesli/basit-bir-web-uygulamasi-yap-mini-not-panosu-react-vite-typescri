<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hata Durumu - Mini Not Panosu</title>

                    "on-secondary-fixed-variant": "#3a485b",
                    "outline-variant": "#434655",
                    "error-container": "#93000a",
                    "surface-tint": "#b4c5ff",

                    "surface-bright": "#373942",

                    "inverse-on-surface": "#2e3039",
                    "on-error": "#690005",

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex items-center justify-center p-md">
<!-- Error State Canvas -->
<main class="w-full max-w-[600px] flex flex-col items-center justify-center text-center space-y-xl">
<!-- Error Icon/Visual -->
<div class="relative flex items-center justify-center w-24 h-24 mb-md">
<div class="absolute inset-0 bg-error-container rounded-full opacity-20 animate-pulse"></div>
<div class="absolute inset-2 bg-error-container rounded-full opacity-40"></div>
<span class="material-symbols-outlined text-[64px] text-error relative z-10" style="font-variation-settings: 'FILL' 1;">
                error
            </span>
</div>
<!-- Typography Cluster -->
<div class="space-y-sm max-w-[480px]">
<h1 class="font-h1 text-h1 text-on-surface">
                Bir Sorun Oluştu
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Veriler yüklenirken sunucu ile iletişim kurulamadı. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.
            </p>
</div>
<!-- Technical Detail (Optional context for pro users) -->
<div class="bg-surface-container rounded-lg p-md w-full border border-outline-variant text-left">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-xs uppercase tracking-wider">Hata Detayı</p>
<code class="font-mono text-[13px] text-error block truncate">
                ERR_CONNECTION_REFUSED: Failed to fetch API endpoint
            </code>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-md w-full sm:w-auto mt-xl">
<button class="h-touch-target px-lg bg-primary-container text-on-primary-container font-label-md text-label-md rounded-DEFAULT hover:bg-primary hover:text-on-primary transition-colors flex items-center justify-center gap-sm active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Tekrar Dene
            </button>
<button class="h-touch-target px-lg border border-outline-variant text-on-surface font-label-md text-label-md rounded-DEFAULT hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-sm active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-[20px]">support_agent</span>
                Destek Al
            </button>
</div>
</main>
